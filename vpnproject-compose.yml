services:
  gluetun:
    image: qmcgaw/gluetun:v3.41.0
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - ####:#### # HttpProxy
      - ####:#### # qBittorrent
    volumes:
      - /volume1/docker/gluetun:/gluetun
      - /volume1/docker/gluetun/wireguard/wg0.conf:/gluetun/wireguard/wg0.conf:ro
    environment:
      - PUID=####
      - PGID=#####
      - TZ=America/New_York
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- --retry-connrefused
        --post-data
        "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}"
        http://172.x.x.x:x/api/v2/app/setPreferences 2>&1'
      - VPN_PORT_FORWARDING_DOWN_COMMAND=/bin/sh -c 'wget -O-
        --retry-connrefused --post-data
        "json={\"listen_port\":0,\"current_network_interface\":\"lo"}"
        http://172.x.x.x:x/api/v2/app/setPreferences 2>&1'
      - HTTPPROXY=on
      - SHADOWSOCKS=off
      - FIREWALL_OUTBOUND_SUBNETS=192.168.x.x/24
    network_mode: synobridge
    security_opt:
      - no-new-privileges:true
    restart: always

  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=####
      - PGID=#####
      - TZ=America/New_York
      - WEBUI_PORT=####
    volumes:
      - /volume1/docker/qbittorrent:/config
      - /volume1/data/torrents:/data/torrents
    network_mode: service:gluetun # run on the vpn network
    depends_on:
      gluetun:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
